<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG UC Center</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0b0f1a,#1a1f2e);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* MAIN BOX */
.box{
background:#151a26;
padding:25px;
border-radius:15px;
width:340px;
box-shadow:0 0 20px rgba(0,0,0,0.6);
text-align:center;
}

/* PUBG LOGO */
.logo{
width:80px;
margin-bottom:10px;
}

/* TITLE */
h2{
color:#f9a825;
margin:10px 0;
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:14px;
background:white;
color:black;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffb300;
}

/* SOCIAL LOGIN */
.social{
background:#1877f2;
color:white;
}

/* SMALL TEXT */
.small{
font-size:12px;
color:#aaa;
margin-top:10px;
}

/* LOGIN POPUP */
.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111827;
padding:20px;
border-radius:15px;
width:300px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

</style>

</head>

<body>

<div class="box">

<!-- PUBG LOGO -->
<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/PUBG_logo.svg">

<h2>PUBG UC CENTER</h2>

<p>سجل الدخول واطلب الشدات</p>

<!-- FORM -->
<form action="/send" method="POST">

<input type="text" name="name" placeholder="اسم اللاعب" required>

<input type="text" name="pubg_id" placeholder="PUBG ID" required>

<select name="uc" required>
<option>60 UC</option>
<option>325 UC</option>
<option>660 UC</option>
<option>1800 UC</option>
</select>

<button type="submit">إرسال الطلب</button>

</form>

<!-- SOCIAL LOGIN BUTTON (شكلي فقط) -->
<button class="social" onclick="openLogin()">
تسجيل دخول عبر الحساب
</button>

<div class="small">
واجهة ترفيهية فقط وليست مرتبطة بأي شركة
</div>

</div>

<!-- POPUP LOGIN -->
<div class="popup" id="popup">

<h3>Login</h3>

<input type="text" placeholder="Username">
<input type="password" placeholder="Password">

<button onclick="fakeLogin()">دخول</button>
<button style="background:red" onclick="closeLogin()">إغلاق</button>

</div>

<script>

function openLogin(){
document.getElementById("popup").style.display="block";
}

function closeLogin(){
document.getElementById("popup").style.display="none";
}

function fakeLogin(){
alert("تم تسجيل الدخول بنجاح (تجريبي)");
closeLogin();
}

</script>

</body>
</html>
