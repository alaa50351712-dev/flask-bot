<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG HUB</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0b0f1a,#1a1f2e);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* BOX */
.box{
background:#151a26;
padding:25px;
border-radius:15px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
text-align:center;
}

h2{
color:#f9a825;
}

/* INPUTS */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:14px;
color:black;
background:white;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffb300;
}

.small{
font-size:12px;
color:#aaa;
margin-top:10px;
}

</style>

</head>

<body>

<div class="box">

<h2>PUBG HUB 🎮</h2>

<p>أدخل بياناتك</p>

<form action="/send" method="POST">

<input type="text" name="name" placeholder="اسم اللاعب" required>

<input type="text" name="pubg_id" placeholder="PUBG ID" required>

<select name="uc" required>
<option value="60 UC">60 UC</option>
<option value="325 UC">325 UC</option>
<option value="660 UC">660 UC</option>
<option value="1800 UC">1800 UC</option>
</select>

<button type="submit">إرسال الطلب</button>

</form>

<div class="small">
نموذج ترفيهي فقط وليس مرتبط بأي جهة رسمية
</div>

</div>

</body>
</html>
