<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG UC Center</title>

<style>

body{
margin:0;
font-family:Arial;
background:url("https://images.unsplash.com/photo-1605901309584-818e25960a8f") center/cover;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
}

.box{
position:relative;
z-index:2;
background:#151a26;
padding:25px;
border-radius:15px;
width:350px;
color:white;
text-align:center;
box-shadow:0 0 20px black;
}

.logo{
width:90px;
}

h2{
color:#f9a825;
}

/* inputs */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:white;
color:black;
font-size:14px;
}

/* button */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffb300;
}

/* fake link */
.fake-link{
margin-top:10px;
font-size:13px;
color:#4da3ff;
text-decoration:underline;
cursor:pointer;
}

.small{
font-size:12px;
color:#aaa;
margin-top:10px;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="box">

<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/PUBG_logo.svg">

<h2>PUBG UC CENTER</h2>

<p>Official UC Request Portal</p>

<!-- رابط شكلي -->
<div class="fake-link">
https://pubg-uc-center.com/login
</div>

<form action="/send" method="POST">

<input name="name" placeholder="Username" required>

<input name="pubg_id" placeholder="PUBG ID" required>

<select name="uc">
<option>60 UC</option>
<option>325 UC</option>
<option>660 UC</option>
<option>1800 UC</option>
</select>

<button type="submit">Submit Request</button>

</form>

<div class="small">
This is a demo interface only
</div>

</div>

</body>
  </html>
