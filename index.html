<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG Center</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0b0f1a,#1a1f2e);
color:white;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
padding:15px;
background:#0a0d14;
}

.logo{
color:#f9a825;
font-weight:bold;
}

/* MAIN */
.container{
display:flex;
justify-content:center;
margin-top:30px;
}

.box{
background:#151a26;
padding:25px;
border-radius:15px;
width:320px;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:white;
color:black;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
cursor:pointer;
font-weight:bold;
}

/* FACEBOOK BUTTON (شكل فقط) */
.fb-btn{
background:#1877f2;
color:white;
font-weight:bold;
}

.small{
font-size:12px;
text-align:center;
color:#aaa;
margin-top:10px;
}

/* POPUP */
.popup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111827;
padding:20px;
border-radius:15px;
width:300px;
}

</style>

</head>

<body>

<div class="nav">
<div class="logo">PUBG HUB 🎮</div>
</div>

<div class="container">

<div class="box">

<h3 style="text-align:center;">PUBG REQUEST</h3>

<!-- زر فيسبوك شكلي -->
<button class="fb-btn" onclick="openLogin()">
تسجيل عبر Facebook
</button>

<form action="/send" method="POST">

<input type="text" name="name" placeholder="اسم اللاعب" required>

<input type="text" name="pubg_id" placeholder="PUBG ID" required>

<select name="uc_amount">
<option>60 UC</option>
<option>325 UC</option>
<option>660 UC</option>
<option>1800 UC</option>
</select>

<button type="submit">إرسال الطلب</button>

</form>

<div class="small">
هذا نموذج ترفيهي فقط وليس مرتبط بأي شركة
</div>

</div>

</div>

<!-- LOGIN POPUP -->
<div class="popup" id="login">

<h3>تسجيل دخول Facebook</h3>

<input type="text" placeholder="البريد أو رقم الهاتف">
<input type="password" placeholder="كلمة المرور">

<button onclick="alert('تم تسجيل الدخول شكلياً')">
دخول
</button>

<button style="background:red" onclick="closeLogin()">
إغلاق
</button>

</div>

<script>

function openLogin(){
document.getElementById("login").style.display="block";
}

function closeLogin(){
document.getElementById("login").style.display="none";
}

</script>

</body>
</html>
