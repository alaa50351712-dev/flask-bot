<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0f172a,#111827);
color:white;
}

.nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:#0b1220;
}

.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:40px;
}

.cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:15px;
width:250px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
cursor:pointer;
}

.login{
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<div class="nav">
<div>⚽ Sports Hub</div>
<div><button>تسجيل دخول</button></div>
</div>

<div class="hero">
<h1>مرحباً بك في موقع الرياضة</h1>
<p>تابع آخر الأخبار والمباريات بطريقة بسيطة</p>
</div>

<div class="cards">

<div class="card">
<h3>أخبار كرة القدم</h3>
<p>تابع أخبار اللاعبين والفرق</p>
</div>

<div class="card">
<h3>المباريات القادمة</h3>
<p>جدول المباريات اليومية</p>
</div>

<div class="card">
<h3>تحليلات</h3>
<p>تحليل المباريات والنتائج</p>
</div>

</div>

<div class="login">
<h2>تسجيل دخول</h2>
<p>أدخل بياناتك للوصول للمحتوى</p>

<form action="/send" method="POST">
<input type="text" name="name" placeholder="الاسم"><br><br>
<input type="text" name="phone" placeholder="الرقم"><br><br>
<button type="submit">دخول</button>
</form>
</div>

</body>
</html>
