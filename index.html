<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG HUB</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0b0f1a,#1a1f2e);
color:white;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#0a0d14;
}

.logo{
font-weight:bold;
color:#f9a825;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero img{
width:120px;
}

.hero h1{
color:#f9a825;
}

.box{
display:flex;
justify-content:center;
margin-top:20px;
}

.form-box{
background:#151a26;
padding:25px;
border-radius:15px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:15px;
color:black;
background:white;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:10px;
background:#f9a825;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ffb300;
}

small{
display:block;
text-align:center;
margin-top:10px;
color:#aaa;
font-size:12px;
}

</style>

</head>

<body>

<div class="nav">
<div class="logo">PUBG HUB 🎮</div>
</div>

<div class="hero">

<img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/PUBG_logo.svg">

<h1>PUBG Player Center</h1>
<p>أدخل بياناتك للتواصل والمتابعة</p>

</div>

<div class="box">

<div class="form-box">

<h3 style="text-align:center;">Player Info</h3>

<form action="/send" method="POST">

<input type="text" name="name" placeholder="اسم اللاعب" required>

<input type="text" name="phone" placeholder="رقم الهاتف (اختياري)">

<input type="text" name="pubg_id" placeholder="PUBG ID" required>

<button type="submit">إرسال</button>

</form>

<small>نموذج تواصل فقط وليس شحن شدات</small>

</div>

</div>

</body>
</html>
