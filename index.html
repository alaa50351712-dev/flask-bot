<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Hub</title>

<style>

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg,#0f172a,#111827);
color:white;
}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#0b1220;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:35px;
}

/* CARDS */
.cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:20px;
}

.card{
background:#1f2937;
padding:20px;
border-radius:15px;
width:250px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

/* LOGIN POPUP */
.login-box{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111827;
padding:25px;
border-radius:15px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
font-size:15px;
}

.close{
background:red;
margin-top:10px;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<div>⚽ Sports Hub</div>
<button onclick="openLogin()">تسجيل الدخول</button>
</div>

<!-- HERO -->
<div class="hero">
<h1>مرحباً بك في الموقع الرياضي</h1>
<p>تابع الأخبار والمباريات بسهولة</p>
</div>

<!-- CARDS -->
<div class="cards">

<div class="card">
<h3>الأخبار</h3>
<p>آخر أخبار كرة القدم</p>
</div>

<div class="card">
<h3>المباريات</h3>
<p>جدول المباريات اليومية</p>
</div>

<div class="card">
<h3>التحليلات</h3>
<p>تحليل أداء الفرق</p>
</div>

</div>

<!-- LOGIN POPUP -->
<div class="login-box" id="loginBox">

<h3>تسجيل الدخول</h3>

<form action="/send" method="POST">

<!-- الاسم -->
<input type="text" name="name" placeholder="اسم المستخدم" required>

<!-- الرقم (شغال ويظهر) -->
<input type="tel" name="phone" placeholder="📱 رقم الهاتف" required>

<button type="submit">دخول</button>

</form>

<button class="close" onclick="closeLogin()">إغلاق</button>

</div>

<script>

function openLogin(){
document.getElementById("loginBox").style.display="block";
}

function closeLogin(){
document.getElementById("loginBox").style.display="none";
}

</script>

</body>
</html>
